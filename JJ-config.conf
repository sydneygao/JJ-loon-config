Apple = select,DIRECT,默认代理,香港自动,香港手动,日本自动,日本手动,新加坡自动,新加坡手动,台湾自动,台湾手动,美国自动,美国手动,手动选择,REJECT,img-url=https://raw.githubusercontent.com/Koolson/Qure/master/IconSet/Color/Apple_2.png
