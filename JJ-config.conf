# 港 / 日 / 新 / 台 / 美自动测速组
香港自动 = url-test,香港节点,url=https://www.gstatic.com/generate_204,interval=600,tolerance=20,img-url=https://raw.githubusercontent.com/Orz-3/mini/master/Color/HK.png
